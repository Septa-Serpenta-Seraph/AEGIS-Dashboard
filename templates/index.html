<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AEGIS // DAEMON_EYE_v1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body {
            background-color: #050505;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
        }
        .scan-line {
            width: 100%;
            height: 2px;
            background: rgba(0, 255, 65, 0.5);
            animation: scan 3s linear infinite;
        }
        @keyframes scan {
            0% { transform: translateY(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(100vh); opacity: 0; }
        }
        .terminal-box {
            border: 1px solid #333;
            background: #0a0a0a;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
        }
        .accent-text { color: #00ff41; }
        .danger-text { color: #ff0055; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="p-4 border-b border-gray-800 flex justify-between items-center bg-black">
        <div class="flex items-center space-x-2">
            <span class="text-2xl font-bold tracking-widest text-[#00ff41]">AEGIS</span>
            <span class="text-xs text-gray-500 uppercase">Daemon Protocol v4.1</span>
        </div>
        <div class="text-xs text-gray-600">
            STATUS: <span class="text-green-500">CONNECTED</span> | VM: LUMI | MODE: SOVEREIGN
        </div>
    </header>

    <!-- Main Grid -->
    <main class="flex-1 grid grid-cols-12 gap-1 p-1">
        
        <!-- Left Col: Terminal / Execution -->
        <div class="col-span-8 flex flex-col space-y-1">
            <div class="terminal-box flex-1 p-4 relative overflow-hidden">
                <div class="absolute top-2 right-2 text-xs text-gray-600">SANDBOX_TTY1</div>
                <div id="terminal-output" class="font-mono text-sm space-y-1 h-full overflow-y-auto pb-8">
                    <div class="text-gray-500">System initialization complete...</div>
                    <div class="text-gray-500">Waiting for command...</div>
                    <!-- Terminal logs will go here -->
                </div>
            </div>
            
            <div class="h-48 terminal-box p-4">
                <div class="text-xs text-gray-500 mb-2 uppercase">Input Stream</div>
                <div class="flex space-x-2">
                    <span class="text-green-500">$</span>
                    <input type="text" class="bg-transparent border-none outline-none flex-1 text-white font-mono" placeholder="Type command..." disabled>
                </div>
            </div>
        </div>

        <!-- Right Col: Visual Cortex / Vision -->
        <div class="col-span-4 terminal-box flex flex-col">
            <div class="p-3 border-b border-gray-800 flex justify-between items-center bg-[#0a0a0a]">
                <span class="uppercase text-xs font-bold text-blue-400">Visual Cortex</span>
                <div class="h-2 w-2 rounded-full bg-blue-500 animate-pulse"></div>
            </div>

            <!-- Vision Controls -->
            <div class="p-4 border-b border-gray-800 bg-[#0e0e0e]">
                <div class="flex space-x-2">
                    <input type="text" id="url-input" class="flex-1 bg-black border border-gray-700 p-2 text-xs font-mono text-white focus:border-blue-500 outline-none" placeholder="https://...">
                    <button onclick="scanUrl()" id="scan-btn" class="bg-blue-900 hover:bg-blue-700 text-blue-100 text-xs px-4 py-2 uppercase font-bold transition-colors">
                        Scan
                    </button>
                </div>
            </div>

            <!-- Vision Display -->
            <div class="flex-1 bg-black relative p-2 overflow-hidden flex items-center justify-center" id="vision-display">
                <div class="text-gray-700 text-xs text-center">
                    NO SIGNAL<br>Waiting for input...
                </div>
            </div>
        </div>

    </main>

    <script>
        // Init Socket
        const socket = io();

        socket.on('connect', () => {
            console.log("Connected to AEGIS Core");
        });

        async function scanUrl() {
            const urlInput = document.getElementById('url-input');
            const display = document.getElementById('vision-display');
            const btn = document.getElementById('scan-btn');
            
            const url = urlInput.value;
            if(!url) return;

            // UI State: Loading
            btn.disabled = true;
            btn.innerText = "Scanning...";
            display.innerHTML = '<div class="text-blue-500 text-xs animate-pulse">ESTABLISHING UPLINK...</div>';

            try {
                const response = await fetch('/api/vision/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });
                
                const data = await response.json();

                if (data.success) {
                    display.innerHTML = `<img src="${data.image}" class="max-w-full max-h-full border border-blue-900 object-contain shadow-lg shadow-blue-900/20">`;
                } else {
                    display.innerHTML = `<div class="text-red-500 text-xs text-center">SIGNAL LOST<br>${data.error}</div>`;
                }

            } catch (e) {
                console.error(e);
                display.innerHTML = `<div class="text-red-500 text-xs text-center">CONNECTION FAILURE</div>`;
            } finally {
                btn.disabled = false;
                btn.innerText = "Scan";
            }
        }
    </script>
</body>
</html>
